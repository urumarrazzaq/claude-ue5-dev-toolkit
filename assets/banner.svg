<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1c"/>
      <stop offset="1" stop-color="#151b33"/>
    </linearGradient>
    <radialGradient id="glowWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a07f"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.3"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1280" height="640" fill="url(#fade)"/></mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle cx="1080" cy="90" r="420" fill="url(#glowWarm)"/>
  <circle cx="120" cy="620" r="380" fill="url(#glowCool)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#titleAccent)"/>

  <!-- Left column -->
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="140" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace"
          font-size="17" font-weight="600" letter-spacing="3" fill="#d97757">CLAUDE CODE  ×  UNREAL ENGINE 5</text>

    <text x="76" y="228" font-size="76" font-weight="800" fill="#f5f7fb" letter-spacing="-1.5">Claude UE5</text>
    <text x="76" y="310" font-size="76" font-weight="800" fill="url(#titleAccent)" letter-spacing="-1.5">Dev Toolkit</text>

    <text x="80" y="364" font-size="22" fill="#aeb6cc">Safety hooks, domain skills and subagents that make</text>
    <text x="80" y="394" font-size="22" fill="#aeb6cc">Claude Code work like a senior Unreal engineer.</text>

    <!-- Feature pills, row 1 -->
    <g font-size="17" font-weight="600" fill="#e6e9f2">
      <rect x="80" y="430" width="168" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ff6b6b" stroke-opacity="0.55"/>
      <circle cx="102" cy="450" r="5" fill="#ff6b6b"/>
      <text x="114" y="456">Safety Hook</text>

      <rect x="260" y="430" width="124" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#d97757" stroke-opacity="0.6"/>
      <circle cx="282" cy="450" r="5" fill="#d97757"/>
      <text x="294" y="456">6 Skills</text>

      <rect x="396" y="430" width="164" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#60a5fa" stroke-opacity="0.6"/>
      <circle cx="418" cy="450" r="5" fill="#60a5fa"/>
      <text x="430" y="456">3 Subagents</text>

      <!-- row 2 -->
      <rect x="80" y="482" width="212" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#34d399" stroke-opacity="0.55"/>
      <circle cx="102" cy="502" r="5" fill="#34d399"/>
      <text x="114" y="508">Project Validator</text>

      <rect x="304" y="482" width="164" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#fbbf24" stroke-opacity="0.55"/>
      <circle cx="326" cy="502" r="5" fill="#fbbf24"/>
      <text x="338" y="508">61 Unit Tests</text>
    </g>

    <text x="80" y="584" font-size="16" fill="#6f7894">C++  ·  Blueprints  ·  AI  ·  Multiplayer  ·  Build &amp; Packaging  ·  Code Review</text>
  </g>

  <!-- Terminal card -->
  <g filter="url(#shadow)">
    <rect x="712" y="128" width="496" height="392" rx="16" fill="#0d1117" stroke="#ffffff" stroke-opacity="0.09"/>
  </g>
  <path d="M712 144a16 16 0 0 1 16-16h464a16 16 0 0 1 16 16v26H712z" fill="#161b26"/>
  <circle cx="738" cy="149" r="6.5" fill="#ff5f57"/>
  <circle cx="760" cy="149" r="6.5" fill="#febc2e"/>
  <circle cx="782" cy="149" r="6.5" fill="#28c840"/>
  <text x="960" y="154" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, monospace"
        font-size="13" fill="#7d869c">PreToolUse · ue5_safety_guard.py</text>

  <!-- Columns are positioned explicitly: SVG renderers collapse leading spaces. -->
  <g font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="17">
    <text x="740" y="214" fill="#d97757">❯</text><text x="760" y="214" fill="#e6e9f2">git reset --hard</text>
    <text x="760" y="242" fill="#ff6b6b">✕</text><text x="782" y="242" fill="#ff6b6b">deny</text><text x="840" y="242" fill="#8b93a7">discards uncommitted work</text>

    <text x="740" y="288" fill="#d97757">❯</text><text x="760" y="288" fill="#e6e9f2">rm -rf Content/</text>
    <text x="760" y="316" fill="#ff6b6b">✕</text><text x="782" y="316" fill="#ff6b6b">deny</text><text x="840" y="316" fill="#8b93a7">protected UE folder</text>

    <text x="740" y="362" fill="#d97757">❯</text><text x="760" y="362" fill="#e6e9f2">git push --force-with-lease</text>
    <text x="760" y="390" fill="#fbbf24">?</text><text x="782" y="390" fill="#fbbf24">ask</text><text x="840" y="390" fill="#8b93a7">rewrites remote history</text>

    <text x="740" y="436" fill="#d97757">❯</text><text x="760" y="436" fill="#e6e9f2">rm -rf Intermediate/</text>
    <text x="760" y="464" fill="#34d399">✓</text><text x="782" y="464" fill="#34d399">ok</text><text x="840" y="464" fill="#8b93a7">regenerable, allowed</text>

    <text x="740" y="500" fill="#d97757">❯</text><text x="760" y="500" fill="#4b5368">█</text>
  </g>

  <text x="1208" y="584" text-anchor="end" font-family="'Cascadia Mono', Consolas, Menlo, monospace"
        font-size="15" fill="#6f7894">github.com/urumarrazzaq/claude-ue5-dev-toolkit</text>
</svg>
